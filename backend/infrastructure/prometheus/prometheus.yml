global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'offer-agent'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'offer-agent-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: offer-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offer_agent}
      POSTGRES_USER: ${POSTGRES_USER:-offer_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./infrastructure/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/02-init-keycloak.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offer_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offer-agent-network

  redis:
    image: redis:7-alpine
    container_name: offer-agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offer-agent-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: offer-agent-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offer-agent-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: offer-agent-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-offer_agent}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
    command:
      - start-dev
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - offer-agent-network

  grafana:
    image: grafana/grafana:10.3.0
    container_name: offer-agent-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - offer-agent-network

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: offer-agent-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - prometheus_data:/prometheus
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - offer-agent-network

  kong-database:
    image: postgres:16-alpine
    container_name: offer-agent-kong-db
    environment:
      POSTGRES_DB: ${KONG_POSTGRES_DB:-kong}
      POSTGRES_USER: ${KONG_POSTGRES_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_POSTGRES_PASSWORD:-kong_password}
    ports:
      - "${KONG_DB_PORT:-5433}:5432"
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_POSTGRES_USER:-kong}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offer-agent-network

  kong-migration:
    image: kong:3.9.1-ubuntu
    container_name: offer-agent-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: ${KONG_POSTGRES_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_POSTGRES_PASSWORD:-kong_password}
      KONG_PG_DATABASE: ${KONG_POSTGRES_DB:-kong}
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - offer-agent-network
    restart: on-failure

  kong:
    image: kong:3.9.1-ubuntu
    container_name: offer-agent-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: ${KONG_POSTGRES_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_POSTGRES_PASSWORD:-kong_password}
      KONG_PG_DATABASE: ${KONG_POSTGRES_DB:-kong}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      A2A_API_KEY: ${A2A_API_KEY:-a2a-test-key-change-in-production}
      FRONTEND_API_KEY: ${FRONTEND_API_KEY:-frontend-test-key-change-in-production}
      MONITORING_API_KEY: ${MONITORING_API_KEY:-monitoring-test-key-change-in-production}
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"      # Proxy HTTP
      - "${KONG_PROXY_SSL_PORT:-8443}:8443"  # Proxy HTTPS
      - "${KONG_ADMIN_PORT:-8001}:8001"      # Admin API
      - "${KONG_ADMIN_GUI_PORT:-8002}:8002"  # Admin GUI
    volumes:
      - ./infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro
      - kong_logs:/var/log/kong
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offer-agent-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  grafana_data:
  prometheus_data:
  kong_db_data:
  kong_logs:

networks:
  offer-agent-network:
    driver: bridge

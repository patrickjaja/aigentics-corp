global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'offer-agent'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend-services'
    static_configs:
      - targets:
          - 'host.docker.internal:8001'  # Conversation service
          - 'host.docker.internal:8002'  # Offer service
          - 'host.docker.internal:8003'  # Customer service
          - 'host.docker.internal:8004'  # Estimation service
          - 'host.docker.internal:8005'  # Notification service
    metrics_path: '/metrics'

  - job_name: 'kong-gateway'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
